---
layout: default
title: Giovanni Benda - Web Development
backlink: progetti
---
{% include header-internal.html %}
<div id="repository" class="section repository">
    <div>
        <div class="category">LAVORI / WEB DEVELOPMENT</div>
        <h2>WEB DEVELOPMENT</h2>
        <p>Siti, applicazioni web e progetti frontend/backend.</p>
    </div>
    <div id="video_cards" class="video_cards">
        <!-- Video cards will be dynamically generated here -->
    </div>
</div>
<div id="popup_video_overlay" class="popup_video_overlay">
    <div id="video_player_card" class="video_player_card">
        <button class="close-popup-btn" onclick="closePlayer()">&times;</button>
        <div class="video_player">
            <div id="video_container" class="video_container"></div>
            <div id="video_functions" class="video_functions">
                <div class="timeline">
                    <div>
                        <div id="initial_video" class="initial_video">00:00</div>
                        <div id="duration_video" class="duration_video">00:00</div>
                    </div>
                    <div class="time_slider">
                        <input type="range" min="1" max="100" value="0" id="timeline" class="video_timeline" onclick="setTimeline()">
                    </div>
                </div>
                <div class="buttons_player">
                    <button id="previous_track" class="previousnext_track" onclick="previousTrack()"><i class="bi bi-chevron-bar-left"></i></button>
                    <button id="remove_seconds" class="addremove_seconds" onclick="removeSeconds()"><i class="bi bi-arrow-counterclockwise"></i></button>
                    <button id="playpause_video" class="button_player" onclick="playpauseVideo()"></button>
                    <button id="add_seconds" class="addremove_seconds" onclick="addSeconds()"><i class="bi bi-arrow-clockwise"></i></button>
                    <button id="next_track" class="previousnext_track" onclick="nextTrack()"><i class="bi bi-chevron-bar-right"></i></button>
                </div>
                <div class="video_settings">
                    <div id="volume_container" class="volume_container">
                        <i id="volume_icon" class="bi bi-volume-up-fill"></i>
                        <div class="volume_slider">
                            <input type="range" min="0" max="100" value="50" id="volumeSlider">
                        </div>
                    </div>
                    <div class="speed_container">
                        <div class="speed_slider">
                            <div>Playback speed</div>
                            <input type="range" min="0" max="5" value="2" id="speedSlider">
                        </div>
                        <p id="speed">1x</p>
                    </div>
                    <div class="autoplay_container">
                        <div class="autoplay_box">
                            <div>Playback settings</div>
                            <div>
                                <div style="border: none;">Autoplay</div>
                                <input type="checkbox" value="on" checked="true" id="autoPlay" onclick="autoPlay()">
                            </div>
                        </div>
                        <i id="autoplay_icon" class="bi bi-gear-fill"></i>
                    </div>
                </div>
            </div>
        </div>
        <div id="video_card_info" class="video_card_info">
            <h1 id="video_title"></h1>
            <h2 id="video_description"></h2>
            <p id="video_author"></p>
        </div>
    </div>
</div>
<script>
    localStorage.setItem('selectedCategory', 'web-development');
</script>
<script src="assets/js/data.js"></script>
<script src="assets/js/list.js"></script>
<script src="assets/js/player.js"></script>
